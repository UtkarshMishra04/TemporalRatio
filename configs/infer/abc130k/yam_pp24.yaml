# Released bimanual-YAM checkpoints (multi-task "pp24" run, 24 tasks; 22 of them are in ABC-130k).
#   878500                            LoRA r32 DiT (merged video_model_full.pt + lora_adapters/)
#   hybrid_fullvideo_dir150k_norm629k  full-DiT checkpoints sharing one action head
#   hybrid_fullvideo_dir175k_norm629k
# Norm stats are read from the checkpoint's assets/. Example:
#   trvam serve configs/infer/abc130k/yam_pp24.yaml --set checkpoint=<ckpt> --port 8000
checkpoint: ${TR_CHECKPOINT:-checkpoints/video_policy_yam/878500}
policy_config: videoVLA_abc130k_pp24_short
video_denoising_steps: 6
feature_extraction_step: 2
generate_video: false
tr_log_layers: [2, 5, 10, 13, 15]
guidance:
  type: none
