# Model family used throughout the paper:
#   video backbone : Cosmos-Predict2.5-2B video DiT (Video2World)
#   action head    : pi0-style Gemma-300M expert, flow matching, reads DiT block `feature_layer`
# Every training preset inherits from this file; override any field in the preset or on the CLI:
#   trvam train <preset.yaml> --set adaptation.lora.rank=64 --set stages.0.steps=50000
model:
  video_backbone: cosmos-predict2.5-2b
  action_head: gemma-300m
  base_video_checkpoint: base          # Cosmos-Predict2.5-2B from the Hugging Face cache
  feature_layer: 19
  action_dim: 32
  action_horizon: 17
  observation_horizon: 17

adaptation:
  video: lora                          # lora | full | frozen
  lora:
    rank: 32
    alpha: 32
    target_modules: [q_proj, k_proj, v_proj, output_proj, mlp.layer1, mlp.layer2]

optim:
  batch_size: 8                        # per GPU
  gradient_accumulation_steps: 1
  warmup_ratio: 0.01
  min_lr_ratio: 0.005
  lr_schedule: cosine
  weight_decay: 1.0e-8
  beta2: 0.99
  gradient_clip_norm: 1.0
  ema_decay: 0.999
  ema_type: power

logging:
  wandb: true
  project: temporal-ratio

distributed:
  nnodes: 2
  nproc_per_node: 8

output_dir: checkpoints
