# Per-skill joint fine-tuning with 93-frame video clips. Pick the skill dataset:
#   trvam train configs/train/abc130k/skill_finetune_93f.yaml \
#     --set data.action_dataset=videoVLA_abc130k_pickplace_short --set data.video_dataset=abc130k_pp24
_base_: _abc130k.yaml
name: abc130k_skill_finetune_93f
paradigm: joint
data:
  action_dataset: videoVLA_abc130k_folding_short
  video_num_frames: 93
stages:
  - name: joint
    mode: joint_full
    steps: 20000
    video_lr: 5.6e-5
    action_lr: 3.0e-4
    video_loss_weight: 5.0
    video_aux_every_k: 2
