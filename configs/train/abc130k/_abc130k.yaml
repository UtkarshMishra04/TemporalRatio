# ABC-130k (bimanual YAM, 3 cameras, 30 FPS). Action data = LeRobot datasets produced by
# scripts/data/convert_abc130k_to_lerobot.py (see docs/data.md); all 22 tasks shared with the
# released checkpoints' training set are used by default.
# Actions/state are 14-D (2 x [6 joints + gripper]) zero-padded to action_dim; 50-step chunks;
# observations are sub-sampled with frame_skip 3.
_base_: ../../base/cosmos2b_gemma300m.yaml
model:
  action_horizon: 50
  observation_horizon: 17
data:
  action_dataset: videoVLA_abc130k_pp24_short
  video_dataset: abc130k_pp24
  video_num_frames: 17
  video_frame_skip: 3
optim:
  video_batch_size: 2
  action_batch_size: 8
  gradient_checkpointing: false
