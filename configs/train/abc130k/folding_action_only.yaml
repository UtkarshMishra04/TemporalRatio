# Folding skill: action head trained on frozen Cosmos-Predict2.5 features (frozen_video).
# This is the recipe of the released YAM folding checkpoints (video_policy_yam/878500).
_base_: _abc130k.yaml
name: abc130k_folding_action_only
paradigm: action_only
data:
  action_dataset: videoVLA_abc130k_folding_short
  video_dataset: abc130k_folding
stages:
  - name: action
    mode: frozen_video
    trainer: dual_resolution
    steps: 900000
    video_lr: 5.6e-5          # ignored by frozen_video (kept to match the original run)
    action_lr: 3.0e-4
    video_loss_weight: 0.5
    video_aux_every_k: 500000
