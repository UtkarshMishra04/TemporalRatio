# Video-then-action with full fine-tuning of the DiT in stage 1 (released checkpoints: full_2stage;
# full_2stage_L17 additionally uses model.feature_layer=17).
_base_: two_stage_lora_r32.yaml
name: libero_two_stage_full
adaptation: {video: full}
stages:
  - name: video
    mode: video_only
    steps: 40000
    video_lr: 1.0e-5
    action_lr: 0.0
    video_loss_weight: 5.0
    init_video_from: base
  - name: action
    mode: frozen_video
    steps: 100000
    video_lr: 0.0
    action_lr: 1.0e-4
    video_loss_weight: 0.0
    init_video_from: previous_stage
