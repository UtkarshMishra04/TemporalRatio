# Video-then-action with 93-frame video clips (released checkpoints: 2stage_93f_r32; also _r16,
# _r64). Stage 1 runs the dual-resolution trainer in joint_full mode with action_lr 0: the action
# loss still shapes the DiT while the head stays at its initialization. Stage 2 trains the action
# head on the frozen DiT with the standard trainer.
_base_: _libero.yaml
name: libero_two_stage_93f_lora_r32
paradigm: custom
data: {video_num_frames: 93}
optim:
  video_batch_size: 2
  action_batch_size: 8
  gradient_checkpointing: false
stages:
  - name: video
    mode: joint_full
    steps: 40000
    video_lr: 2.0e-5
    action_lr: 0.0
    video_loss_weight: 5.0
    init_video_from: base
  - name: action
    mode: frozen_video
    trainer: standard
    steps: 100000
    video_lr: 0.0
    action_lr: 1.0e-4
    video_loss_weight: 0.0
    init_video_from: previous_stage
    gradient_checkpointing: true
