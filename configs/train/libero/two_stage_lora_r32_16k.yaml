# Shorter video-then-action schedule (16k video + 50k action steps) used in the Temporal Ratio
# experiments.
_base_: two_stage_lora_r32.yaml
name: libero_two_stage_lora_r32_16k
stages:
  - name: video
    mode: video_only
    steps: 16000
    video_lr: 1.0e-4
    action_lr: 1.0e-6
    video_loss_weight: 5.0
    init_video_from: base
    save_interval: 4000
    video_log_interval: 4000
  - name: action
    mode: frozen_video
    steps: 50000
    video_lr: 0.0
    action_lr: 1.0e-4
    video_loss_weight: 0.0
    init_video_from: previous_stage
    save_interval: 4000
    video_log_interval: 4000
