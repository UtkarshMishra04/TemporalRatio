# Joint video-action training, LoRA r32 on the DiT (released checkpoints: joint_r32).
# Variants: joint_lora_r16, joint_lora_r64.
_base_: _libero.yaml
name: libero_joint_lora_r32
paradigm: joint
stages:
  - name: joint
    mode: joint_full
    steps: 100000
    video_lr: 1.0e-4
    action_lr: 1.0e-4
    video_loss_weight: 5.0
