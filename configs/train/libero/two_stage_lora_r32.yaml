# Video-then-action, LoRA r32 (released checkpoints: 2stage_r32; also _r16, _r64):
#   stage 1 adapts the DiT on video only, stage 2 trains the action head on the frozen DiT.
_base_: _libero.yaml
name: libero_two_stage_lora_r32
paradigm: two_stage
stages:
  - name: video
    mode: video_only
    steps: 40000
    video_lr: 1.0e-4
    action_lr: 0.0
    video_loss_weight: 5.0
    init_video_from: base
  - name: action
    mode: frozen_video
    steps: 100000
    video_lr: 0.0
    action_lr: 1.0e-4
    video_loss_weight: 0.0
    init_video_from: previous_stage
