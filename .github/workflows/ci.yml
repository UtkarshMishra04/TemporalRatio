name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: CPU tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[test]"
      - name: Unit tests (configs, TR / guidance math, secret scan)
        run: .venv/bin/pytest -q
      - name: CLI
        run: |
          for f in configs/infer/*/*.yaml; do
            .venv/bin/trvam show "$f" > /dev/null
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - name: Strict lint for the release modules
        run: >-
          uvx ruff check --select E,F,W,I,B,UP --ignore E501
          src/temporal_ratio/config src/temporal_ratio/cli.py src/temporal_ratio/inference.py
          src/temporal_ratio/guidance/scale.py src/temporal_ratio/guidance/tr.py
          src/temporal_ratio/data/abc130k.py scripts/check_server.py tests

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
